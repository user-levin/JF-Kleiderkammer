<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # HTTP → HTTPS redirect (außer für /health)
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/health$
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/public

    SSLEngine on
    # Gesetzt von config/apache/start.sh: eigenes Zertifikat aus config/ssl oder selbstsigniertes
    SSLCertificateFile ${SSL_CERT_FILE}
    SSLCertificateKeyFile ${SSL_KEY_FILE}

    # CSP global setzen (falls Directory-Header nicht greift)
    <IfModule mod_headers.c>
        Header always unset Content-Security-Policy
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https: ws: wss:; media-src 'self'"
    </IfModule>

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # IMPORTANT: Do NOT rewrite /api/* routes
    <Directory /var/www/html/public/api>
        RewriteEngine Off
    </Directory>

    # SPA-Rewrites für React Router (Frontend unter /ui/)
    <Directory /var/www/html/public/ui>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Prevent stale cached shell HTML
        <FilesMatch "^index\.html$">
            Header set Cache-Control "no-store"
        </FilesMatch>

        # React Router: alle Requests zu index.html, außer für echte Dateien/Ordner
        RewriteEngine On
        RewriteBase /ui/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /ui/index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
